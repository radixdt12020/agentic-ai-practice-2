name: Autonomous Coding Agent

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to solve (e.g. 4)'
        required: false
        default: '4'

jobs:
  auto-solve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/agent') && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai pytest

      - name: Run Agent (Generate or Revise Code)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          IS_PR_COMMENT: ${{ github.event_name == 'issue_comment' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Create Password Validator and Strength Checker' }}
          ISSUE_BODY: ${{ github.event.issue.body || 'Create validate_password function checking length, uppercase, lowercase, numbers, and special characters with pytest tests' }}
          ISSUE_NUM: ${{ github.event.issue.number || github.event.inputs.issue_number || 4 }}
        run: |
          python - << 'EOF'
          import os
          import json
          import re
          import time
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          client = genai.Client(api_key=api_key)

          is_pr_comment = os.environ.get("IS_PR_COMMENT") == "true"
          comment_body = os.environ.get("COMMENT_BODY", "")
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")
          issue_num = os.environ.get("ISSUE_NUM", "4")

          print(f"==================================================")
          print(f"🎯 PROCESSING ISSUE #{issue_num}: {issue_title}")
          print(f"📝 DESCRIPTION: {issue_body}")
          print(f"==================================================")

          if is_pr_comment:
              print("🔄 Applying Human Reviewer Revisions...")
              existing_code = open("solution.py").read() if os.path.exists("solution.py") else ""
              existing_tests = open("test_solution.py").read() if os.path.exists("test_solution.py") else ""

              prompt = f"""
              You are an AI software engineer revising existing code based on human review.
              Current solution.py:
              {existing_code}

              Current test_solution.py:
              {existing_tests}

              Reviewer Feedback:
              {comment_body}

              Return ONLY a JSON object:
              {{
                "solution_code": "updated python code",
                "test_code": "updated pytest code"
              }}
              """
          else:
              print("✨ Creating Fresh Solution for this Specific Issue...")
              prompt = f"""
              You are an autonomous senior Python engineer.
              Build a complete solution for this specific task:
              
              TITLE: {issue_title}
              REQUIREMENTS: {issue_body}

              DO NOT generate an LRU Cache. Solve the exact problem specified in the TITLE and REQUIREMENTS above.
              
              Return ONLY a valid JSON object:
              {{
                "solution_code": "def ...",
                "test_code": "import pytest ..."
              }}
              """

          models_to_try = [
              "models/gemini-3.8-flash",
              "models/gemini-3.7-flash",
              "models/gemini-3.5-flash",
              "models/gemini-flash-latest"
          ]

          response = None
          for model_name in models_to_try:
              try:
                  print(f"🤖 Querying {model_name}...")
                  response = client.models.generate_content(
                      model=model_name,
                      contents=prompt,
                      config={'response_mime_type': 'application/json'}
                  )
                  print(f"✅ Success with {model_name}!")
                  break
              except Exception as e:
                  print(f"⚠️ {model_name} failed: {e}")
                  time.sleep(2)

          if response is None:
              raise RuntimeError("Could not generate code from models.")

          text = response.text.strip()
          if text.startswith("```"):
              text = re.sub(r"^```json|^```|```$", "", text, flags=re.MULTILINE).strip()

          data = json.loads(text)

          with open("solution.py", "w", encoding="utf-8") as f:
              f.write(data["solution_code"])

          with open("test_solution.py", "w", encoding="utf-8") as f:
              f.write(data["test_code"])
          EOF

      - name: Evaluate (Run Automated Unit Tests)
        run: |
          pytest test_solution.py

      - name: Create Autonomous Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(agent): implement issue #${{ github.event.issue.number || github.event.inputs.issue_number || 4 }}"
          branch: "agent/issue-${{ github.event.issue.number || github.event.inputs.issue_number || 4 }}"
          title: "🤖 Agent PR: ${{ github.event.issue.title || 'Password Validator and Checker' }}"
          body: |
            ## Autonomous Agent Implementation
            Closes #${{ github.event.issue.number || github.event.inputs.issue_number || 4 }}
            
            ### Task Description
            ${{ github.event.issue.body || 'Create Password Validator and Strength Checker' }}
            
            ### Evaluation Status
            - **Unit Tests:** ✅ Passed (`pytest test_solution.py`)
            - **Branch:** `agent/issue-${{ github.event.issue.number || github.event.inputs.issue_number || 4 }}`
            
            Please review the diff and approve to merge.
