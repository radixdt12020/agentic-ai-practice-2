name: Autonomous Coding Agent

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

jobs:
  auto-solve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai pytest

      - name: Run Autonomous Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'String helper functions' }}
          ISSUE_BODY: ${{ github.event.issue.body || 'Create string helper functions with reverse and palindrome methods and unit tests' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || 1 }}
        run: |
          python - << 'EOF'
          import os
          import json
          import re
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise ValueError("GEMINI_API_KEY is missing from GitHub Secrets!")

          client = genai.Client(api_key=api_key)
          issue_title = os.environ.get("ISSUE_TITLE", "Sample Task")
          issue_body = os.environ.get("ISSUE_BODY", "")

          # Dynamically find the best available model for your API key
          available_models = [m.name for m in client.models.list()]
          print(f"Available models for this key: {available_models}")

          # Pick the first available flash model (e.g., gemini-2.0-flash or gemini-1.5-flash)
          chosen_model = next((m for m in available_models if 'flash' in m), available_models[0])
          print(f"Selected model: {chosen_model}")

          prompt = f"""
          You are an autonomous senior software engineer.
          A user opened an issue:
          Title: {issue_title}
          Description: {issue_body}

          Generate two files:
          1. The solution code in Python (`solution.py`).
          2. Pytest unit tests in Python (`test_solution.py`).

          Return ONLY a JSON object with this format (no extra text):
          {{
            "solution_code": "def ...",
            "test_code": "import pytest ...",
            "pr_summary": "brief summary"
          }}
          """

          response = client.models.generate_content(
              model=chosen_model,
              contents=prompt,
              config={'response_mime_type': 'application/json'}
          )

          # Parse response
          text = response.text.strip()
          if text.startswith("```"):
              text = re.sub(r"^```json|^```|```$", "", text, flags=re.MULTILINE).strip()

          data = json.loads(text)

          with open("solution.py", "w", encoding="utf-8") as f:
              f.write(data["solution_code"])

          with open("test_solution.py", "w", encoding="utf-8") as f:
              f.write(data["test_code"])

          with open("pr_summary.txt", "w", encoding="utf-8") as f:
              f.write(data.get("pr_summary", "Autonomous agent implementation"))
          EOF

      - name: Evaluate (Run Automated Unit Tests)
        run: |
          pytest test_solution.py

      - name: Create Autonomous Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: agent auto-implementation for issue #${{ github.event.issue.number || 1 }}"
          branch: "agent/issue-${{ github.event.issue.number || 1 }}"
          title: "🤖 Agent PR: ${{ github.event.issue.title || 'Auto Implementation' }}"
          body: |
            ## Autonomous Agent Implementation
            Closes #${{ github.event.issue.number || 1 }}
            
            ### Evaluation Status
            - **Unit Tests:** ✅ Passed (`pytest test_solution.py`)
            - **Branch:** `agent/issue-${{ github.event.issue.number || 1 }}`
            
            Please review the diff and approve to merge.
