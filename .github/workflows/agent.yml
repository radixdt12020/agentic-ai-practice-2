name: Multi-Agent Squad (Developer + Security Auditor)

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:

jobs:
  multi-agent-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai pytest

      - name: Execute Multi-Agent Squad Workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Multi-Agent Secure Auth Task' }}
          ISSUE_BODY: ${{ github.event.issue.body || 'Build a secure password hasher and token generator' }}
          ISSUE_NUM: ${{ github.event.issue.number || 10 }}
        run: |
          python - << 'EOF'
          import os
          import json
          import re
          import subprocess
          import time
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")

          def call_llm(prompt_text):
              models = ["models/gemini-3.7-flash", "models/gemini-3.8-flash", "models/gemini-flash-latest"]
              for m in models:
                  for attempt in range(2):
                      try:
                          res = client.models.generate_content(
                              model=m,
                              contents=prompt_text,
                              config={'response_mime_type': 'application/json'}
                          )
                          return res.text
                      except Exception:
                          time.sleep(2)
              raise RuntimeError("All models unavailable")

          def clean_json(raw_text):
              raw_text = raw_text.strip()
              if raw_text.startswith("```"):
                  raw_text = re.sub(r"^```json|^```|```$", "", raw_text, flags=re.MULTILINE).strip()
              return json.loads(raw_text)

          print("==================================================")
          print("🤖 AGENT 1 (DEVELOPER): Generating Implementation...")
          print("==================================================")
          coder_prompt = f"""
          You are Developer Agent.
          Task: {issue_title}
          Requirements: {issue_body}

          Write clean Python code in solution.py and pytest tests in test_solution.py.
          Return ONLY valid JSON:
          {{"solution_code": "code here", "test_code": "test here"}}
          """
          coder_output = clean_json(call_llm(coder_prompt))
          current_code = coder_output["solution_code"]
          current_tests = coder_output["test_code"]

          print("\n==================================================")
          print("🕵️ AGENT 2 (SECURITY AUDITOR): Conducting Security Review...")
          print("==================================================")
          security_prompt = f"""
          You are an adversarial Senior AppSec Auditor inspecting code before production.
          Inspect this code for security vulnerabilities:
          {current_code}

          Check for:
          - Insecure cryptographic algorithms (e.g. MD5, SHA1 for passwords)
          - Hardcoded credentials or secrets
          - ReDoS or unbounded buffer vulnerabilities
          - Injection flaws

          Return ONLY valid JSON:
          {{
            "passed": true/false,
            "severity": "CLEAN" | "LOW" | "HIGH",
            "findings": "summary of findings",
            "required_fixes": "concrete instructions for the developer if failed"
          }}
          """
          audit = clean_json(call_llm(security_prompt))
          print(f"Audit Status: {'✅ PASSED' if audit['passed'] else '⚠️ REJECTED BY SECURITY'}")
          print(f"Findings: {audit['findings']}")

          # ADVERSARIAL PEER-REVIEW LOOP (If Security Agent rejected the code)
          if not audit["passed"]:
              print("\n🔄 [ADVERSARIAL LOOP]: Routing security audit feedback back to Developer Agent...")
              remediation_prompt = f"""
              You are Developer Agent.
              The Security Auditor REJECTED your code with this finding:
              {audit['findings']}
              Required Fixes: {audit.get('required_fixes', 'Make it secure')}

              Original Code:
              {current_code}

              Rewrite solution.py to fix all security vulnerabilities and update test_solution.py.
              Return ONLY valid JSON:
              {{"solution_code": "...", "test_code": "..."}}
              """
              fixed_output = clean_json(call_llm(remediation_prompt))
              current_code = fixed_output["solution_code"]
              current_tests = fixed_output["test_code"]
              print("✅ Developer Agent successfully patched the security vulnerabilities!")

          # Save final code
          with open("solution.py", "w", encoding="utf-8") as f:
              f.write(current_code)
          with open("test_solution.py", "w", encoding="utf-8") as f:
              f.write(current_tests)

          # Pytest Evaluation
          print("\n🔍 Evaluating with pytest test suite...")
          test_run = subprocess.run(["pytest", "test_solution.py"], capture_output=True, text=True)
          if test_run.returncode != 0:
              print(test_run.stdout)
              print(test_run.stderr)
              raise RuntimeError("Pytest failed on final code.")
          print("✅ All unit tests PASSED green!")

          # Generate Multi-Agent Sign-off Report
          report = f"""
          ### 👥 Multi-Agent Collaboration Sign-Off
          - **Developer Agent:** Generated implementation & pytest tests
          - **Security Auditor Agent:** Conducted automated OWASP vulnerability scan
          - **Security Audit Status:** `{'PASSED (Clean)' if audit['passed'] else 'PASSED (Remediated Security Vulnerabilities)'}`
          - **Security Auditor Findings:** {audit['findings']}
          - **Automated CI Checks:** ✅ Passed (`pytest test_solution.py`)
          """
          with open("multi_agent_report.md", "w", encoding="utf-8") as f:
              f.write(report)
          EOF

      - name: Create Multi-Agent Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(multi-agent): implement issue #${{ github.event.issue.number || 10 }}"
          branch: "agent/multi-agent-${{ github.event.issue.number || 10 }}"
          title: "🤖 Multi-Agent PR: ${{ github.event.issue.title || 'Secure Feature' }}"
          body: |
            ## Autonomous Multi-Agent Squad Implementation
            Closes #${{ github.event.issue.number || 10 }}
            
            $(cat multi_agent_report.md)
            
            ---
            *Human-in-the-Loop review requested.*
