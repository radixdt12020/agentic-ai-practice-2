name: Autonomous Coding Agent

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  auto-solve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/agent'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR Branch if Commenting
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checkout ${{ github.event.issue.number }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai pytest

      - name: Run Agent (Generate or Revise Code)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IS_PR_COMMENT: ${{ github.event_name == 'issue_comment' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Password Validator' }}
          ISSUE_BODY: ${{ github.event.issue.body || 'Password validation rules' }}
        run: |
          python - << 'EOF'
          import os
          import json
          import re
          import time
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          client = genai.Client(api_key=api_key)

          is_pr_comment = os.environ.get("IS_PR_COMMENT") == "true"
          comment_body = os.environ.get("COMMENT_BODY", "")
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")

          if is_pr_comment:
              print(f"🔄 Applying Human Reviewer Revisions from comment: {comment_body}")
              existing_code = open("solution.py").read() if os.path.exists("solution.py") else ""
              existing_tests = open("test_solution.py").read() if os.path.exists("test_solution.py") else ""

              prompt = f"""
              You are an AI software engineer revising existing code based on human code review.
              Current solution.py:
              {existing_code}

              Current test_solution.py:
              {existing_tests}

              Human Reviewer Feedback:
              {comment_body}

              Apply the feedback and return ONLY a valid JSON object:
              {{
                "solution_code": "updated python code",
                "test_code": "updated pytest code"
              }}
              """
          else:
              print(f"✨ Creating Fresh Implementation for: {issue_title}...")
              prompt = f"""
              You are an autonomous senior Python engineer.
              Build a complete solution for:
              TITLE: {issue_title}
              REQUIREMENTS: {issue_body}

              Return ONLY a valid JSON object:
              {{
                "solution_code": "def ...",
                "test_code": "import pytest ..."
              }}
              """

          models_to_try = [
              "models/gemini-3.8-flash",
              "models/gemini-3.7-flash",
              "models/gemini-3.5-flash",
              "models/gemini-flash-latest"
          ]

          response = None
          for model_name in models_to_try:
              try:
                  print(f"🤖 Querying {model_name}...")
                  response = client.models.generate_content(
                      model=model_name,
                      contents=prompt,
                      config={'response_mime_type': 'application/json'}
                  )
                  print(f"✅ Success with {model_name}!")
                  break
              except Exception as e:
                  print(f"⚠️ {model_name} failed: {e}")
                  time.sleep(2)

          if response is None:
              raise RuntimeError("Could not generate code from models.")

          text = response.text.strip()
          if text.startswith("```"):
              text = re.sub(r"^```json|^```|```$", "", text, flags=re.MULTILINE).strip()

          data = json.loads(text)

          with open("solution.py", "w", encoding="utf-8") as f:
              f.write(data["solution_code"])

          with open("test_solution.py", "w", encoding="utf-8") as f:
              f.write(data["test_code"])
          EOF

      - name: Evaluate (Run Automated Unit Tests)
        run: |
          pytest test_solution.py

      - name: Push Revision Directly to PR Branch (if PR Comment)
        if: github.event_name == 'issue_comment'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add solution.py test_solution.py
          git commit -m "refactor(agent): apply human review changes"
          git push

      - name: Create Pull Request (if New Issue)
        if: github.event_name != 'issue_comment'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(agent): implement issue #${{ github.event.issue.number || 4 }}"
          branch: "agent/issue-${{ github.event.issue.number || 4 }}"
          title: "🤖 Agent PR: ${{ github.event.issue.title || 'Password Validator' }}"
          body: |
            ## Autonomous Agent Implementation
            Closes #${{ github.event.issue.number || 4 }}
            
            ### Task Description
            ${{ github.event.issue.body || 'Password Validator' }}
            
            ### Evaluation Status
            - **Unit Tests:** ✅ Passed (`pytest test_solution.py`)
            - **Branch:** `agent/issue-${{ github.event.issue.number || 4 }}`
            
            Please review the diff and approve to merge.
