name: Autonomous Coding Agent (Enterprise Guardrailed)

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  auto-solve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/agent'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR Branch if Commenting
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checkout ${{ github.event.issue.number }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai pytest

      - name: Run Agent with Self-Healing Loop & Escalation
        id: agent_step
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IS_PR_COMMENT: ${{ github.event_name == 'issue_comment' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Task' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUM: ${{ github.event.issue.number || 4 }}
        run: |
          python - << 'EOF'
          import os
          import json
          import re
          import subprocess
          import time
          from datetime import datetime
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          is_pr_comment = os.environ.get("IS_PR_COMMENT") == "true"
          comment_body = os.environ.get("COMMENT_BODY", "")
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")

          def call_llm(prompt_text):
              models = ["models/gemini-3.7-flash", "models/gemini-3.8-flash", "models/gemini-flash-latest"]
              for m in models:
                  try:
                      res = client.models.generate_content(
                          model=m,
                          contents=prompt_text,
                          config={'response_mime_type': 'application/json'}
                      )
                      return res, m
                  except Exception:
                      time.sleep(1)
              raise RuntimeError("LLM Unavailable")

          MAX_ATTEMPTS = 3
          iteration = 0
          test_error_feedback = ""
          success = False
          active_model = "unknown"

          while iteration < MAX_ATTEMPTS:
              iteration += 1
              print(f"\n🔄 ==========================================")
              print(f"🔄 [AGENT ITERATION {iteration}/{MAX_ATTEMPTS}]")
              print(f"🔄 ==========================================")

              if test_error_feedback:
                  print("⚠️ Previous attempt failed unit tests. Attempting self-healing...")
                  prompt = f"""
                  Task: {issue_title}
                  Previous code failed pytest with this error:
                  {test_error_feedback}
                  
                  Modify solution.py and test_solution.py to fix this.
                  Return ONLY JSON: {{"solution_code": "...", "test_code": "..."}}
                  """
              else:
                  prompt = f"""
                  Task: {issue_title}
                  Requirements: {issue_body}
                  Write Python solution.py and test_solution.py.
                  Return ONLY JSON: {{"solution_code": "...", "test_code": "..."}}
                  """

              response, active_model = call_llm(prompt)
              text = response.text.strip()
              if text.startswith("```"):
                  text = re.sub(r"^```json|^```|```$", "", text, flags=re.MULTILINE).strip()
              data = json.loads(text)

              with open("solution.py", "w", encoding="utf-8") as f:
                  f.write(data["solution_code"])
              with open("test_solution.py", "w", encoding="utf-8") as f:
                  f.write(data["test_code"])

              # Evaluate with pytest
              print(f"🔍 [EVALUATE ITERATION {iteration}]: Running pytest...")
              test_run = subprocess.run(["pytest", "test_solution.py"], capture_output=True, text=True)

              if test_run.returncode == 0:
                  print(f"✅ Iteration {iteration}: ALL TESTS PASSED!")
                  success = True
                  break
              else:
                  print(f"❌ Iteration {iteration} FAILED pytest checks.")
                  test_error_feedback = test_run.stdout + "\n" + test_run.stderr

          # Check Circuit Breaker Status
          if not success:
              print(f"\n🚨 CIRCUIT BREAKER TRIPPED! Maximum attempts ({MAX_ATTEMPTS}/{MAX_ATTEMPTS}) reached.")
              with open("escalation_report.md", "w") as f:
                  f.write(f"### 🚨 Agent Circuit Breaker Tripped\n")
                  f.write(f"The AI Agent exhausted all `{MAX_ATTEMPTS}` self-healing iterations without passing CI.\n\n")
                  f.write(f"**Last Error Trace:**\n```\n{test_error_feedback[:500]}\n```\n\n")
                  f.write(f"**Action Required:** Human engineer review needed.\n")
              
              # Set step output to escalated
              with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
                  gh_out.write("status=escalated\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
                  gh_out.write("status=success\n")

              with open("audit_report.md", "w") as f:
                  f.write(f"### 📋 Traceability Report\n- **Iterations Used:** `{iteration}/{MAX_ATTEMPTS}`\n- **Status:** Passed\n")
          EOF

      # IF ESCALATED: Post a comment on the Issue asking for human help
      - name: Escalate to Human on Issue
        if: steps.agent_step.outputs.status == 'escalated' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file escalation_report.md
          gh issue edit ${{ github.event.issue.number }} --add-label "needs-human-review"

      # IF SUCCESSFUL: Create the Pull Request
      - name: Create Pull Request (Only if tests passed)
        if: steps.agent_step.outputs.status == 'success' && github.event_name != 'issue_comment'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(agent): implement issue #${{ github.event.issue.number || 4 }}"
          branch: "agent/issue-${{ github.event.issue.number || 4 }}"
          title: "🤖 Agent PR: ${{ github.event.issue.title || 'Implementation' }}"
          body: |
            ## Autonomous Agent Implementation
            Closes #${{ github.event.issue.number || 4 }}
            
            $(cat audit_report.md)
