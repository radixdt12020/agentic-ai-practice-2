name: Autonomous Coding Agent (Grounded by AGENTS.md)

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:

jobs:
  auto-solve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai pytest

      - name: Run Grounded Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'User Registration Validator' }}
          ISSUE_BODY: ${{ github.event.issue.body || 'Validate user registration payloads' }}
          ISSUE_NUM: ${{ github.event.issue.number || 30 }}
        run: |
          python - << 'EOF'
          import os
          import json
          import re
          import subprocess
          import time
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")

          # STEP 1: CONTEXT GROUNDING - Read AGENTS.md if present
          repo_guidelines = ""
          if os.path.exists("AGENTS.md"):
              with open("AGENTS.md", "r", encoding="utf-8") as f:
                  repo_guidelines = f.read()
              print("🧠 [CONTEXT GROUNDING]: Discovered and loaded AGENTS.md steering rules!")
          else:
              print("⚠️ No AGENTS.md found. Operating with standard defaults.")

          def call_llm(prompt_text):
              models = ["models/gemini-3.7-flash", "models/gemini-3.8-flash", "models/gemini-flash-latest"]
              last_err = None
              for m in models:
                  for attempt in range(3):
                      try:
                          res = client.models.generate_content(
                              model=m,
                              contents=prompt_text,
                              config={'response_mime_type': 'application/json'}
                          )
                          return res.text
                      except Exception as e:
                          print(f"⚠️ {m} error: {e}. Retrying in 4s...")
                          last_err = e
                          time.sleep(4)
              raise last_err

          def clean_json(raw_text):
              raw_text = raw_text.strip()
              if raw_text.startswith("```"):
                  raw_text = re.sub(r"^```json|^```|```$", "", raw_text, flags=re.MULTILINE).strip()
              return json.loads(raw_text)

          print("\n==================================================")
          print("🤖 AGENT: Generating Implementation Grounded in Repo Rules...")
          print("==================================================")

          prompt = f"""
          You are an enterprise AI software engineer.
          
          === REPOSITORY STEERING GUIDELINES (MANDATORY) ===
          {repo_guidelines}
          =================================================

          === ASSIGNED TASK ===
          Title: {issue_title}
          Requirements: {issue_body}
          =====================

          Instructions:
          1. Implement `solution.py` satisfying the task while STRICTLY following all rules in REPOSITORY STEERING GUIDELINES.
          2. Write full pytest unit tests in `test_solution.py`.
          
          Return ONLY valid JSON:
          {{
            "solution_code": "code here",
            "test_code": "pytest code here",
            "guideline_compliance": [
              "Rule 1: Included # ARCHITECTURE COMPLIANT header",
              "Rule 2: Defined custom exception class",
              "Rule 3: Used Google docstrings",
              "Rule 4: Full typing hints"
            ]
          }}
          """

          output = clean_json(call_llm(prompt))

          with open("solution.py", "w", encoding="utf-8") as f:
              f.write(output["solution_code"])

          with open("test_solution.py", "w", encoding="utf-8") as f:
              f.write(output["test_code"])

          # STEP 2: EVALUATE WITH PYTEST
          print("\n🔍 Evaluating with pytest test suite...")
          test_run = subprocess.run(["pytest", "test_solution.py"], capture_output=True, text=True)
          if test_run.returncode != 0:
              print(test_run.stdout)
              print(test_run.stderr)
              raise RuntimeError("Pytest execution failed.")
          print("✅ All unit tests PASSED green!")

          # STEP 3: AUDIT COMPLIANCE REPORT
          compliance_items = "\n".join([f"- ✅ {item}" for item in output.get("guideline_compliance", [])])
          report = f"""
          ### 🧠 AGENTS.md Governance & Compliance Verification
          The AI Agent inspected `AGENTS.md` before coding and certified compliance:
          {compliance_items}
          
          - **Unit Tests:** ✅ Passed (`pytest test_solution.py`)
          """
          with open("grounding_report.md", "w", encoding="utf-8") as f:
              f.write(report)
          EOF

      - name: Create Grounded Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(agent): implement issue #${{ github.event.issue.number || 30 }} compliant with AGENTS.md"
          branch: "agent/issue-${{ github.event.issue.number || 30 }}"
          title: "🤖 Agent PR: ${{ github.event.issue.title || 'Grounded Feature' }}"
          body: |
            ## Autonomous Agent Implementation (Steered by AGENTS.md)
            Closes #${{ github.event.issue.number || 30 }}
            
            $(cat grounding_report.md)
            
            ---
            *Human-in-the-Loop review requested.*
