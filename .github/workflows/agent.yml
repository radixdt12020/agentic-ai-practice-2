name: Autonomous Coding Agent

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  auto-solve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'opened' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/agent') && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.issue.pull_request != null && format('agent/issue-{0}', github.event.issue.number) || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai pytest

      - name: Run Agent (Generate or Revise Code)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IS_PR_COMMENT: ${{ github.event_name == 'issue_comment' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || 'Task' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || 1 }}
        run: |
          python - << 'EOF'
          import os
          import json
          import re
          import time
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          client = genai.Client(api_key=api_key)

          is_pr_comment = os.environ.get("IS_PR_COMMENT") == "true"
          comment_body = os.environ.get("COMMENT_BODY", "")
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")

          existing_code = ""
          existing_tests = ""
          if os.path.exists("solution.py"):
              with open("solution.py", "r", encoding="utf-8") as f:
                  existing_code = f.read()
          if os.path.exists("test_solution.py"):
              with open("test_solution.py", "r", encoding="utf-8") as f:
                  existing_tests = f.read()

          if is_pr_comment:
              print("🔄 Applying Human Reviewer Revisions...")
              prompt = f"""
              You are an autonomous AI coding agent revising your work based on human code review.
              
              Original Task: {issue_title} - {issue_body}
              Current solution.py:
              {existing_code}

              Current test_solution.py:
              {existing_tests}

              Human Reviewer Feedback:
              {comment_body}

              Apply the requested changes to both the code and unit tests.
              Return ONLY a valid JSON object:
              {{
                "solution_code": "updated code",
                "test_code": "updated tests",
                "pr_summary": "Summary of revisions made"
              }}
              """
          else:
              print("✨ Creating Initial Implementation...")
              prompt = f"""
              You are an autonomous senior software engineer.
              Task Title: {issue_title}
              Task Description: {issue_body}

              Generate Python solution code and complete pytest unit tests.
              Return ONLY a valid JSON object:
              {{
                "solution_code": "def ...",
                "test_code": "import pytest ...",
                "pr_summary": "Summary of solution"
              }}
              """

          # Fallback models list in order of preference
          models_to_try = [
              "models/gemini-3.8-flash",
              "models/gemini-3.7-flash",
              "models/gemini-3.5-flash",
              "models/gemini-flash-latest"
          ]

          response = None
          last_exception = None

          for model_name in models_to_try:
              for attempt in range(2):
                  try:
                      print(f"🤖 Attempting with {model_name} (Attempt {attempt + 1})...")
                      response = client.models.generate_content(
                          model=model_name,
                          contents=prompt,
                          config={'response_mime_type': 'application/json'}
                      )
                      print(f"✅ Success with {model_name}!")
                      break
                  except Exception as e:
                      print(f"⚠️ {model_name} failed: {e}")
                      last_exception = e
                      time.sleep(2)
              if response is not None:
                  break

          if response is None:
              raise last_exception

          text = response.text.strip()
          if text.startswith("```"):
              text = re.sub(r"^```json|^```|```$", "", text, flags=re.MULTILINE).strip()

          data = json.loads(text)

          with open("solution.py", "w", encoding="utf-8") as f:
              f.write(data["solution_code"])

          with open("test_solution.py", "w", encoding="utf-8") as f:
              f.write(data["test_code"])
          EOF

      - name: Evaluate (Run Automated Unit Tests)
        run: |
          pytest test_solution.py

      - name: Commit Revision or Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(agent): update implementation based on task/review"
          branch: "agent/issue-${{ github.event.issue.number || 1 }}"
          title: "🤖 Agent PR: ${{ github.event.issue.title || 'Auto Implementation' }}"
          body: |
            ## Autonomous Agent Implementation
            Closes #${{ github.event.issue.number || 1 }}
            
            ### Evaluation Status
            - **Unit Tests:** ✅ Passed (`pytest test_solution.py`)
            - **Branch:** `agent/issue-${{ github.event.issue.number || 1 }}`
            
            Please review the diff and approve to merge.
